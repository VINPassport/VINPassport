<script data-moved-to="../v/">
/* Moved for good. GitHub Pages has no server redirects, so this page forwards
   the query and the section as well as the path. Printed QR codes and shared links say /verify/?v=<key>, and the query IS the passport, so it travels. */
(function () {
  var to = '../v/', sections = {};
  var h = location.hash.slice(1);
  location.replace(to + location.search + (h ? '#' + (sections[h] || h) : ''));
})();
</script>
