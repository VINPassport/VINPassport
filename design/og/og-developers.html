<!doctype html>
<!--
  Link-preview image for /developers/ (1200 x 630), rendered by scripts/build-og.mjs to
  site/og/og-developers.png. Recreates the design handoff's og-developers.png with the live
  contract's numbers: 23 circuits and 18 verifier keys (contract-info.json), 176 contract tests and
  43 of 43 guards (README). Change a number here, then run: node scripts/build-og.mjs
  SPDX-License-Identifier: Apache-2.0
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-developers</title>
<link rel="stylesheet" href="../../site/assets/vp.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .wave { position: absolute; left: 0; right: 0; bottom: 30px; height: 170px; opacity: .45; display: flex; }
  .wave img { width: 50%; height: 100%; flex: none; display: block; }
  .logo { position: absolute; left: 62px; top: 60px; height: 56px; width: auto; }
  .eyebrow { position: absolute; left: 64px; top: 246px; font-family: var(--font-label); font-weight: 600; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--passport-blue); }
  .title { position: absolute; left: 62px; top: 282px; width: 520px; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 66px; line-height: 1.07; letter-spacing: -.02em; font-variation-settings: 'opsz' 144; color: var(--ink); }
  .url { position: absolute; left: 64px; top: 541px; font-family: var(--font-mono); font-weight: 500; font-size: 22px; color: var(--passport-blue); }
  .og-code { position: absolute; left: 660px; top: 60px; width: 476px; height: 262px; background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius-doc); box-shadow: var(--shadow-doc); padding: 30px 30px 0; font-family: var(--font-mono); font-size: 19px; line-height: 30px; color: var(--ink); }
  .og-code .c { color: var(--ink-muted); }
  .og-code .gap { height: 18px; }
  .og-code .foot { margin-top: 14px; padding-top: 16px; border-top: 1px dashed var(--rule-strong); display: flex; align-items: center; justify-content: space-between; }
  .og-code .vp-stamp { font-size: 17px; }
  .og-stats { position: absolute; left: 660px; top: 340px; width: 476px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
  .og-stat { background: var(--blue-tint); border-radius: var(--radius-md); height: 122px; padding: 16px 16px 0; }
  .og-stat b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -.01em; color: var(--passport-blue); }
  .og-stat span { display: block; margin-top: 14px; font-family: var(--font-label); font-weight: 600; font-size: 13.5px; line-height: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="og">
  <div class="wave" aria-hidden="true"><img src="../../site/assets/brand/wave-a.svg" alt=""><img src="../../site/assets/brand/wave-a.svg" alt=""></div>
  <img class="logo" src="../../site/assets/brand/vinpassport-logo-horizontal-primary.svg" alt="VINPassport">
  <div class="eyebrow">Developers · Apache-2.0</div>
  <h1 class="title">Open source. Every rule checkable.</h1>
  <div class="url">github.com/VINPassport</div>
  <div class="og-code">
    <div class="c">// stores a commitment only</div>
    <div>persistentCommit(value, salt)</div>
    <div class="gap"></div>
    <div class="c">// readings can only go up</div>
    <div>neverFalls(84,209 km)</div>
    <div class="foot"><span>last proven: 126,480 km</span><span class="vp-stamp vp-stamp--refused">Refused</span></div>
  </div>
  <div class="og-stats">
    <div class="og-stat"><b>23</b><span>Circuits</span></div>
    <div class="og-stat"><b>176</b><span>Contract tests</span></div>
    <div class="og-stat"><b>43/43</b><span>Guards<br>mutation-checked</span></div>
  </div>
</div>
</body>
</html>
